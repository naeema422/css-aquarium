<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Aquarium | Pure CSS Art</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="header">
    <h1><span>Aquarium</span></h1>
    <p>Life underwater</p>
  </header>

  <main class="aquarium">
    <!-- Water surface glow -->
    <div class="light-rays"></div>

    <!-- Seaweed -->
    <div class="seaweed seaweed-1"></div>
    <div class="seaweed seaweed-2"></div>
    <div class="seaweed seaweed-3"></div>
    <div class="seaweed seaweed-4"></div>

    <!-- Fish -->
    <div class="fish fish-1"><span class="tail"></span><span class="eye"></span></div>
    <div class="fish fish-2"><span class="tail"></span><span class="eye"></span></div>
    <div class="fish fish-3"><span class="tail"></span><span class="eye"></span></div>
    <div class="fish fish-4"><span class="tail"></span><span class="eye"></span></div>
    <div class="fish fish-5"><span class="tail"></span><span class="eye"></span></div>

    <!-- Bubbles -->
    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>
    <div class="bubble bubble-3"></div>
    <div class="bubble bubble-4"></div>
    <div class="bubble bubble-5"></div>
    <div class="bubble bubble-6"></div>

    <!-- Sand floor -->
    <div class="sand"></div>
  </main>

  <footer class="footer">
    <p>© 2026 CSS Aquarium · Zero JavaScript 🌊</p>
  </footer>

</body>
</html>
